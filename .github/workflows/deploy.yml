name: Deploy
on:
  push:
    branches: [main]

env:
  APP_PATH: /home/${{ secrets.DEPLOY_USER }}/github-public/attendance-system-migration

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kintai_user
          POSTGRES_PASSWORD: kintai_pass
          POSTGRES_DB: KINTAI
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Api.Tests/AttendanceApi.Tests.csproj

      - name: Init DB
        run: |
          PGPASSWORD=kintai_pass psql -h 127.0.0.1 -U kintai_user -d KINTAI \
            < infrastructure/db/init/01_schema.sql

      - name: Test
        run: dotnet test src/Api.Tests/AttendanceApi.Tests.csproj --no-restore --verbosity normal

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='volume' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            . ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.APP_PATH }}/

      - name: Restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.APP_PATH }}
            docker compose up -d --build
